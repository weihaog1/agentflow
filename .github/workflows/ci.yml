name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality, tests, evaluation, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=agentflow --cov-report=term-missing --cov-report=xml
      - name: Evaluation smoke gate
        run: uv run python evals/run_smoke.py
      - name: Verify committed cache benchmark
        run: uv run python -m agentflow.benchmarks.cache --verify-committed
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend-quality:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [python-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: worker
          push: false
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          target: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  compose-smoke:
    name: Docker Compose end-to-end smoke
    runs-on: ubuntu-latest
    needs: container-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - name: Start complete local stack
        run: docker compose up -d --build --wait
      - name: Ingest corpus and verify three workflows
        run: uv run python scripts/smoke_test.py --timeout 120
      - name: Capture Compose state and logs
        if: always()
        run: |
          docker compose ps --all > compose-ps.txt
          docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-smoke-logs
          path: |
            compose-ps.txt
            compose.log
          if-no-files-found: warn
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
