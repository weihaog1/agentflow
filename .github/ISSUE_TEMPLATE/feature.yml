name: Feature request
description: Propose a scoped improvement to one supported AgentFlow workflow.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator or evidence-quality problem without prescribing a solution.
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Product boundary
      options:
        - Cited question answering
        - Document comparison
        - Executive brief
        - Shared ingestion and evidence infrastructure
        - Operator workflow across supported features
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest behavior change that solves the problem.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safety effect
      description: State how citations, corpus revision, caching, untrusted content, and workspace isolation are affected.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks, including tests or evaluation cases.
      placeholder: |
        - [ ] Given ... when ... then ...
        - [ ] Citation validation proves ...
        - [ ] Existing cache identities remain correct ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
