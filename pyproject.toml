[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.1.0"
description = "Evidence-first document workflows with inspectable citations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alan Guo" }]
dependencies = [
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "langgraph>=0.2,<2",
  "openai>=1.50,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-boto3[s3]>=1.35,<2",
  "types-defusedxml>=0.7,<1",
]

[project.scripts]
agentflow-api = "agentflow.cli:api"
agentflow-worker = "agentflow.cli:worker"
agentflow-migrate = "agentflow.cli:migrate"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*", "pypdf.*", "langgraph.*"]
ignore_missing_imports = true
